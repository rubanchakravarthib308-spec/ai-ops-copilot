[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ops-copilot"
version = "0.1.0"
description = "A production-minded incident triage copilot with runbook retrieval, risk gates, human approval, and audit evidence."
requires-python = ">=3.11"
authors = [{ name = "Ruban Chakravarthi" }]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
ai-ops-demo = "ai_ops_copilot.demo:main"
